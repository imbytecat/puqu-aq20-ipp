name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: go test ./...
      - name: Build Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go build -tags embed -ldflags "-X main.version=${GITHUB_REF_NAME}" -o puqu-ipp ./cmd/puqu-ipp
          mkdir -p dist
          tar -czf "dist/puqu-ipp-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" puqu-ipp
      - name: Build Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -tags embed -ldflags "-X main.version=$env:GITHUB_REF_NAME" -o puqu-ipp.exe ./cmd/puqu-ipp
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive puqu-ipp.exe "dist/puqu-ipp-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: puqu-ipp-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
